data:
  npoints: 2048
  dataset: modelnet10
  type: all

model:
  hdim: 64
  heads: 4
  activation: swish
  prior_dim: 32
  vb_depth: 2
  vb_hdim: 64
  is_sizes: [32, 16, 8, 4, 2, 1, 1]
  zdims: [16, 16, 16, 16, 16, 16, 16]
  n_mixtures: 5
  output_activation: identity
  
train:
  loss_function:
    type: chamfer_distance
  lr: 0.001
  epochs: 1000
  batch_size: 128
  beta: 1.0
  beta_anealer:
    type: linear
    max_value: 1.0
    milestone: 900
  use_gpu: true
  valid_check_interval: 30
  validation_check_after_epoch: true
  checkpoint_interval_epochs: 1
  early_stopping: false
  patience: 100000
  grad_skip: false
  save_val_predictions: true
  val_prediction_count: 16
  val_prediction_interval_epochs: 10
  val_prediction_dirname: val_predictionsdata
  seed: 1
  model_dir: setvae_c2
  verbose: true
