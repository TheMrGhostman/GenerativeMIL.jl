data:
  npoints: 512
  dataset: mnist
  cardinality_count: balanced
  sample_on_fly: false
  normalize: true

model:
  hdim: 64
  heads: 4
  activation: gelu
  prior_dim: 32
  vb_depth: 2
  vb_hdim: 64
  is_sizes: [32, 16, 8, 4, 2, 1, 1]
  zdims: [16, 16, 16, 16, 16, 16, 16]
  n_mixtures: 5
  output_activation: identity
  
train:
  loss_function:
    type: chamfer_distance
  lr: 0.001
  lr_scheduler:
    type: WarmupCosine
    milestones: [0.02, 0.8]
    scale: 10
  epochs: 500
  batch_size: 256
  beta: 1.0
  beta_anealer:
    type: linear
    max_value: 1.0
    milestone: 450
  use_gpu: true
  valid_check_interval: 150
  validation_check_after_epoch: false
  checkpoint_interval_epochs: 10
  early_stopping: true
  patience: 100000
  grad_skip: false
  save_val_predictions: true
  val_prediction_count: 16
  val_prediction_interval_epochs: 10
  val_prediction_dirname: val_predictionsdata
  seed: 1
  model_dir: cd_setvae_c7
  verbose: true
