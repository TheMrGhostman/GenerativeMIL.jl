data:
  npoints: 2048
  dataset: modelnet10
  type: all

model:
  hdim: 64
  heads: 4
  activation: swish
  prior_dim: 32
  vb_depth: 1
  vb_hdim: 64
  is_sizes: [32, 16, 8]
  zdims: [16, 16, 16]
  expansion_depth: 4
  expansion_hidden_dim: 64
  n_mixtures: 5
  output_activation: identity
  
train:
  loss_function:
    type: maximum_mean_discrepancy
    sigma: [0.7943277, 1.5886554, 3.1773107] #[0.39716384, 0.7943277, 1.5886554, 3.1773107, 6.3546214] # [0.25,0.5,1.0,2.0,4.0] * 1.5886554f0; estimate of \sigma  
    kernel: rbf
  lr: 0.0001
  epochs: 200
  batch_size: 16
  beta: 1.0
  beta_anealer:
    type: linear
    max_value: 1.0
    milestone: 180
  use_gpu: true
  valid_check_interval: 200
  validation_check_after_epoch: false
  checkpoint_interval_epochs: 2
  early_stopping: false
  patience: 100000
  grad_skip: false
  save_val_predictions: true
  val_prediction_count: 16
  val_prediction_interval_epochs: 10
  val_prediction_dirname: val_predictionsdata
  seed: 1
  model_dir: mmd_setvae_c14
  verbose: true
