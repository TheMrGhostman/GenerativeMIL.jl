data:
  npoints: 2048
  dataset: modelnet10
  type: all

model:
  prpdim: 64
  prpdepth: 3
  popdim: 64
  popdepth: 3
  zdim: 64
  decdim: 64
  decdepth: 3
  poolf: "mean-max"
  gen_sigma: "scalar"
  activation: "swish"
  init_seed: 1

train:
  loss_function:
    type: maximum_mean_discrepancy
    sigma: [0.7943277, 1.5886554, 3.1773107]
    kernel: rbf
  lr: 0.0001
  lr_scheduler:
    type: WarmupCosine
    milestones: [0.02, 0.8]
    scale: 5
  epochs: 200
  batch_size: 16
  use_gpu: true
  valid_check_interval: 200
  validation_check_after_epoch: false
  checkpoint_interval_epochs: 10
  early_stopping: false
  patience: 100000
  grad_skip: false
  save_val_predictions: true
  val_prediction_count: 16
  val_prediction_interval_epochs: 10
  val_prediction_dirname: val_predictionsdata
  seed: 1
  model_dir: mmd_poolmodel_c1
  verbose: true